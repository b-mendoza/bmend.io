name: "Setup Node.js, pnpm and dependencies"

description: Setup Node.js environment, pnpm package manager, restore/save the pnpm store cache, and install project dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - name: Set pnpm store path
      id: pnpm-store-path
      shell: bash
      run: |
        store_path="$(pnpm store path --silent)"
        mkdir -p "$store_path"
        echo "path=$store_path" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Restore pnpm store cache
      id: cache-restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Show tool versions
      shell: bash
      run: |
        node -v
        pnpm --version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store cache
      if: steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
